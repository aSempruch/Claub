model: sonnet
effort: high

allowed_user_ids:
  - "YOUR_DISCORD_USER_ID"

# Global lifecycle hooks — run by AgentProcess around every claude subprocess.
# Per-agent on_start / on_stop (under each agent) are additive on top of these.
on_start:
  - "curl -fsS --max-time 20 -X POST http://host.docker.internal:9500/start/$CLAUB_AGENT_NAME || true"
on_stop:
  - "curl -fsS --max-time 10 -X POST http://host.docker.internal:9500/stop/$CLAUB_AGENT_NAME || true"

agents:
  main:
    channel_id: "YOUR_MAIN_CHANNEL_ID"

  journalist:
    channel_id: "YOUR_JOURNALIST_CHANNEL_ID"
    display_name: "The Journalist"

  shopping-assistant:
    channel_id: "YOUR_SHOPPING_CHANNEL_ID"
    display_name: "Shopping Assistant"
    allowed_skills:
      - amazon-browse

  # The execution sandbox is OFF by default — opt in per agent. The agent also
  # needs a "sandbox" server in its {name}.mcp.json (see journalist.mcp.json)
  # and "mcp__sandbox__*" in settings.json's allow list, and its name must be in
  # the exec bridge's config.json allowlist or calls 404.
  # leetcode-coach:
  #   channel_id: "YOUR_CHANNEL_ID"
  #   allowed_tools_additional:
  #     - "mcp__sandbox__*"
  #   allowed_skills:
  #     - algorithm-animation

  trader:
    channel_id: "YOUR_TRADER_CHANNEL_ID"

# Agents in the same group can message each other via
# mcp__agents__message_agent_{name} (one tool per reachable agent).
agent_groups:
  assistants: [main, journalist]
