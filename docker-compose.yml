services:
  claub:
    build: .
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - TZ=America/New_York
    volumes:
      - claude-home:/root/.claude
      - ~/docker/claub:/claub
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "claude-assistant"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  claude-home:
