services:
  claub:
    build: .
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_LOGIN=${NEXTCLOUD_LOGIN}
      - NEXTCLOUD_TOKEN=${NEXTCLOUD_TOKEN}
      - HASS_URL=${HASS_URL}
      - HASS_TOKEN=${HASS_TOKEN}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - NOTION_TOKEN=${NOTION_TOKEN}
      # Shared secret for the host-side exec bridge (scripts/exec-bridge).
      # Forwarded from here into the sandbox MCP's env block in the per-agent
      # .mcp.json; never reaches the sandbox container itself.
      - EXEC_BRIDGE_SECRET=${EXEC_BRIDGE_SECRET}
      - TZ=${TZ:-America/New_York}
      - CLAUB_HOST_PATH=${CLAUB_DATA_PATH}
      # Keep the Dockerfile's pinned CLI version — the CLI otherwise
      # self-updates inside the running container, silently defeating the pin.
      - DISABLE_AUTOUPDATER=1
    volumes:
      - claude-home:/root/.claude
      - ${CLAUB_DATA_PATH:?Set CLAUB_DATA_PATH in .env}:/claub
      - ${CLAUB_DATA_PATH}:${CLAUB_DATA_PATH}
      - /Users/you/repos/shared/data:/claub/workspaces/career/shared-data
      - /Users/you/repos/shared/data:/claub/workspaces/leetcode-coach/shared-data
      - /Users/you/repos/shared/data:/claub/workspaces/analyst/shared-data
      - /tmp/playwright:/tmp/playwright:ro
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "claude-assistant"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  claude-home:
