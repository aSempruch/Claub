services:
  claub:
    build: .
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_LOGIN=${NEXTCLOUD_LOGIN}
      - NEXTCLOUD_TOKEN=${NEXTCLOUD_TOKEN}
      - HASS_URL=${HASS_URL}
      - HASS_TOKEN=${HASS_TOKEN}
      # Entity ids the hass MCP watches. Kept in .envrc so personal HASS
      # entity names stay out of the repo; mcps/hass/server.py has placeholders.
      - HASS_PERSON_ENTITY=${HASS_PERSON_ENTITY:-}
      - HASS_TV_ENTITY=${HASS_TV_ENTITY:-}
      - HASS_PC_ENTITY=${HASS_PC_ENTITY:-}
      - STEAM_API_KEY=${STEAM_API_KEY}
      - NOTION_TOKEN=${NOTION_TOKEN}
      # Alpaca paper-trading keys for the trader agent's MCP (mcps/alpaca).
      # Live keys deliberately stay out of the container; see the design spec.
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER=${ALPACA_PAPER:-true}
      - ALPACA_TRADING_DISABLED=${ALPACA_TRADING_DISABLED:-}
      - ALPACA_MAX_POSITION_PCT=${ALPACA_MAX_POSITION_PCT:-}
      - ALPACA_MAX_ORDERS_PER_DAY=${ALPACA_MAX_ORDERS_PER_DAY:-}
      - ALPACA_DRAWDOWN_HALT_PCT=${ALPACA_DRAWDOWN_HALT_PCT:-}
      # Shared secret for the host-side exec bridge (scripts/exec-bridge).
      # Forwarded from here into the sandbox MCP's env block in the per-agent
      # .mcp.json; never reaches the sandbox container itself.
      - EXEC_BRIDGE_SECRET=${EXEC_BRIDGE_SECRET}
      - TZ=${TZ:-America/New_York}
      - CLAUB_HOST_PATH=${CLAUB_DATA_PATH}
      # Keep the Dockerfile's pinned CLI version — the CLI otherwise
      # self-updates inside the running container, silently defeating the pin.
      - DISABLE_AUTOUPDATER=1
    volumes:
      - claude-home:/root/.claude
      - ${CLAUB_DATA_PATH:?Set CLAUB_DATA_PATH in .env}:/claub
      - ${CLAUB_DATA_PATH}:${CLAUB_DATA_PATH}
      - /tmp/playwright:/tmp/playwright:ro
      # Host-specific extras (absolute paths, per-agent data mounts) belong in
      # an untracked docker-compose.override.yml — Compose merges it
      # automatically. See docker-compose.override.example.yml.
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "claude-assistant"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  claude-home:
